[package]
name = "nexus-weave"
version = "1.0.0"
description = "Nexus 织知 —— 本地优先的 AI 对话知识管理工作台"
authors = ["Nexus Weave"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["config-json5"] }
tauri-plugin-http = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
