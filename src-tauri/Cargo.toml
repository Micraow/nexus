[package]
name = "nexus-weave"
version = "0.1.0"
description = "Nexus Weave desktop shell"
authors = ["Nexus Weave"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["config-json5"] }
tauri-plugin-http = "2"
tauri-plugin-clipboard-manager = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
